<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>몽글몽글 장소 검색</title>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Gaegu', cursive;
            background:
                radial-gradient(circle at 8% 12%, rgba(255, 206, 226, 0.75) 0 70px, transparent 72px),
                radial-gradient(circle at 92% 18%, rgba(255, 236, 158, 0.75) 0 95px, transparent 97px),
                radial-gradient(circle at 15% 90%, rgba(189, 231, 255, 0.75) 0 90px, transparent 92px),
                linear-gradient(135deg, #fff7dd 0%, #fff1f8 45%, #eaf7ff 100%);
            overflow: hidden;
        }

        .container {
            display: flex; width: 100%; height: 100vh;
            padding: 18px; gap: 18px; position: relative;
        }

        .container::before {
            content: '✦  ♡  ✿  ✦  ♡  ✿';
            position: absolute; top: 10px; right: 34px;
            color: rgba(255, 154, 191, 0.45);
            font-size: 28px; letter-spacing: 12px; pointer-events: none;
        }

        #menu_wrap {
            width: 360px; padding: 22px;
            background: rgba(255, 255, 255, 0.86);
            border: 3px solid rgba(255, 255, 255, 0.95);
            border-radius: 34px;
            box-shadow: 0 18px 38px rgba(255, 162, 189, 0.24), 0 8px 18px rgba(108, 86, 64, 0.08);
            display: flex; flex-direction: column; overflow: hidden;
            backdrop-filter: blur(12px); position: relative;
        }

        #menu_wrap::after {
            content: ''; position: absolute; width: 88px; height: 88px;
            right: -22px; top: -24px;
            background: radial-gradient(circle, #ffd6e5 0 45%, transparent 47%);
            opacity: 0.8;
        }

        .title_box { text-align: center; margin-bottom: 18px; position: relative; z-index: 1; }

        h2 {
            font-family: 'Jua', sans-serif; font-size: 2rem;
            color: #ff7aa8; margin: 0; text-shadow: 0 3px 0 #fff0a8;
        }

        .subtitle { margin-top: 7px; color: #9b8a7d; font-size: 1.08rem; }

        .search_box {
            display: flex; gap: 9px; margin-bottom: 14px; padding: 9px;
            background: #fff8cf; border: 2px dashed #ffc4d8;
            border-radius: 24px; position: relative; z-index: 1;
        }

        input {
            flex: 1; min-width: 0; padding: 13px 14px; border: 0;
            border-radius: 17px; outline: none; font-family: 'Gaegu', cursive;
            font-size: 1.25rem; color: #6f5a4a; background: #ffffff;
            box-shadow: inset 0 2px 7px rgba(255, 191, 213, 0.2);
        }

        input::placeholder { color: #c2aaa0; }

        button {
            padding: 10px 18px; cursor: pointer;
            background: linear-gradient(135deg, #ff86b5, #ffb35c);
            border: none; border-radius: 17px; color: white;
            font-family: 'Jua', sans-serif; font-size: 1.05rem;
            box-shadow: 0 7px 0 #e86f8f, 0 12px 18px rgba(255, 127, 172, 0.22);
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        button:hover { transform: translateY(-2px); box-shadow: 0 9px 0 #e86f8f, 0 15px 22px rgba(255, 127, 172, 0.28); }
        button:active { transform: translateY(4px); box-shadow: 0 3px 0 #e86f8f, 0 7px 12px rgba(255, 127, 172, 0.18); }

        .section_title {
            display: flex; align-items: center; justify-content: space-between;
            margin: 8px 2px 9px; color: #f26b9b;
            font-family: 'Jua', sans-serif; font-size: 1.18rem; position: relative; z-index: 1;
        }

        .mini_note {
            font-family: 'Gaegu', cursive; color: #a7958d; font-size: 0.96rem;
        }

        #placesList, #favoriteList {
            list-style: none; padding: 3px 2px 2px; margin: 0;
            overflow-y: auto; scrollbar-width: thin; scrollbar-color: #ffc1d8 transparent;
            position: relative; z-index: 1;
        }

        #placesList { flex: 1.1; min-height: 150px; }
        #favoriteList { flex: 0.9; min-height: 120px; }

        #placesList::-webkit-scrollbar, #favoriteList::-webkit-scrollbar { width: 8px; }
        #placesList::-webkit-scrollbar-thumb, #favoriteList::-webkit-scrollbar-thumb { background: #ffc1d8; border-radius: 99px; }

        #placesList li, #favoriteList li {
            padding: 15px 16px 14px 18px;
            background: linear-gradient(135deg, #ffffff 0%, #fff9fb 100%);
            margin-bottom: 13px; border-radius: 24px; border: 2px solid #ffe4ec;
            box-shadow: 0 9px 18px rgba(255, 176, 203, 0.14);
            transition: all 0.2s ease-in-out; cursor: pointer; position: relative; overflow: hidden;
        }

        #placesList li::before { content: '📍'; position: absolute; right: 15px; top: 12px; font-size: 1.3rem; opacity: 0.72; }
        #favoriteList li::before { content: '💗'; position: absolute; right: 15px; top: 12px; font-size: 1.25rem; opacity: 0.78; }

        #placesList li::after, #favoriteList li::after {
            content: ''; position: absolute; width: 48px; height: 48px;
            right: -18px; bottom: -18px; border-radius: 50%; background: rgba(255, 238, 153, 0.62);
        }

        #placesList li:hover, #favoriteList li:hover {
            background: linear-gradient(135deg, #fff7bd 0%, #ffe4ef 100%);
            transform: translateY(-3px) scale(1.015); border-color: #ffc0d6;
        }

        #placesList li strong, #favoriteList li strong {
            color: #f26b9b; font-size: 1.28rem; display: block;
            padding-right: 28px; line-height: 1.25;
            font-family: 'Jua', sans-serif; font-weight: 400;
        }

        #placesList li span, #favoriteList li span {
            color: #8f8a85; font-size: 1rem; display: block; margin-top: 5px; line-height: 1.25;
        }

        .remove_favorite {
            margin-top: 8px; display: inline-block; padding: 4px 9px;
            border-radius: 999px; background: #fff0f5; color: #e65b8b;
            font-size: 0.95rem; border: 1px solid #ffc7da;
        }

        .empty_hint {
            padding: 12px; text-align: center; color: #b59a8d;
            background: rgba(255, 255, 255, 0.55); border-radius: 20px;
            border: 1px solid rgba(255, 196, 216, 0.55); font-size: 1.02rem;
            margin: 2px 0 12px; position: relative; z-index: 1;
        }

        #map {
            flex: 1; height: 100%; border-radius: 34px;
            border: 8px solid rgba(255, 255, 255, 0.96);
            box-shadow: 0 18px 38px rgba(108, 86, 64, 0.13), 0 8px 20px rgba(255, 159, 196, 0.18);
            overflow: hidden;
        }

        .customoverlay {
            position: relative; bottom: 58px; border-radius: 20px;
            border: 2px solid #ff9bc0; background: #fff; padding: 8px 13px 7px;
            font-size: 15px; font-family: 'Jua', sans-serif; color: #f05f96;
            box-shadow: 0 8px 17px rgba(255, 138, 181, 0.22);
            white-space: nowrap; cursor: pointer; user-select: none;
        }

        .customoverlay::before { content: '♡'; margin-right: 5px; color: #ffb84d; }
        .customoverlay:hover { background: #fff4ba; transform: translateY(-2px); }
        .customoverlay:after {
            content: ''; position: absolute; margin-left: -9px; left: 50%; bottom: -10px;
            width: 0; height: 0; border-top: 10px solid #ff9bc0;
            border-left: 9px solid transparent; border-right: 9px solid transparent;
        }

        @media (max-width: 820px) {
            body, html { overflow: auto; }
            .container { flex-direction: column; height: auto; min-height: 100vh; }
            #menu_wrap { width: 100%; min-height: 480px; }
            #map { min-height: 420px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="menu_wrap">
        <div class="title_box">
            <h2>🐾 몽글몽글 검색</h2>
            <div class="subtitle">가고 싶은 장소를 말해줘!</div>
        </div>
        <form onsubmit="searchPlaces(); return false;" class="search_box">
            <input type="text" value="카페" id="keyword" placeholder="어디가 궁금해?">
            <button type="submit">찾기</button>
        </form>

        <div class="section_title">검색 결과 <span class="mini_note">장소를 눌러 지도 보기</span></div>
        <ul id="placesList"></ul>
        <div class="empty_hint">지도 말풍선을 클릭하면 찜한 장소에 저장돼요 ˙ᵕ˙</div>

        <div class="section_title">💗 찜한 장소 <span class="mini_note">나중에 다시 확인!</span></div>
        <ul id="favoriteList"></ul>
    </div>
    <div id="map"></div>
</div>

<script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=812e888a788f00bb238aabf1e311cc38&libraries=services"></script>

<script>
var markers = [];
var overlays = [];
var favoritePlaces = JSON.parse(localStorage.getItem('favoritePlaces')) || [];

var mapContainer = document.getElementById('map'),
    mapOption = { center: new kakao.maps.LatLng(37.66, 126.83), level: 4 };

var map = new kakao.maps.Map(mapContainer, mapOption);
var ps = new kakao.maps.services.Places();

renderFavorites();

function searchPlaces() {
    var keyword = document.getElementById('keyword').value;
    if (!keyword.replace(/^\s+|\s+$/g, '')) {
        alert('검색어를 입력해줘! 🐾');
        return false;
    }
    ps.keywordSearch(keyword, placesSearchCB);
}

function placesSearchCB(data, status, pagination) {
    if (status === kakao.maps.services.Status.OK) {
        displayPlaces(data);
    } else {
        alert('앗! 검색 결과가 없어 ㅠ_ㅠ');
    }
}

function displayPlaces(places) {
    var listEl = document.getElementById('placesList'),
        bounds = new kakao.maps.LatLngBounds();

    listEl.innerHTML = '';
    removeMarker();

    var imageSrc = 'https://cdn-icons-png.flaticon.com/512/1077/1077163.png',
        imageSize = new kakao.maps.Size(42, 42),
        markerImage = new kakao.maps.MarkerImage(imageSrc, imageSize);

    for (var i=0; i<places.length; i++) {
        var placePosition = new kakao.maps.LatLng(places[i].y, places[i].x);

        var marker = new kakao.maps.Marker({ position: placePosition, image: markerImage });
        marker.setMap(map);
        markers.push(marker);

        var placeData = {
            id: places[i].id,
            place_name: places[i].place_name,
            address_name: places[i].address_name,
            x: places[i].x,
            y: places[i].y
        };

        var content = '<div class="customoverlay" title="클릭해서 찜하기">' + places[i].place_name + '</div>';
        var overlay = new kakao.maps.CustomOverlay({ content: content, position: placePosition });

        bounds.extend(placePosition);

        var itemEl = document.createElement('li');
        itemEl.innerHTML = '<strong>' + places[i].place_name + '</strong><span>' + places[i].address_name + '</span>';

        (function(m, o, p, place) {
            itemEl.onclick = function() {
                closeAllOverlays();
                o.setMap(map);
                map.panTo(p);
                setTimeout(function() {
                    var overlayEl = document.querySelector('.customoverlay');
                    if (overlayEl) overlayEl.onclick = function() { addFavorite(place); };
                }, 0);
            };

            kakao.maps.event.addListener(m, 'click', function() {
                closeAllOverlays();
                o.setMap(map);
                setTimeout(function() {
                    var overlayEl = document.querySelector('.customoverlay');
                    if (overlayEl) overlayEl.onclick = function() { addFavorite(place); };
                }, 0);
            });
        })(marker, overlay, placePosition, placeData);

        overlays.push(overlay);
        listEl.appendChild(itemEl);
    }
    map.setBounds(bounds);
}

function addFavorite(place) {
    var alreadyExists = favoritePlaces.some(function(item) {
        return item.id === place.id || (item.place_name === place.place_name && item.address_name === place.address_name);
    });

    if (alreadyExists) {
        alert('이미 찜한 장소예요 💗');
        return;
    }

    favoritePlaces.push(place);
    localStorage.setItem('favoritePlaces', JSON.stringify(favoritePlaces));
    renderFavorites();
    alert('찜한 장소에 추가했어요! 💕');
}

function renderFavorites() {
    var favoriteList = document.getElementById('favoriteList');
    favoriteList.innerHTML = '';

    if (favoritePlaces.length === 0) {
        var emptyEl = document.createElement('li');
        emptyEl.innerHTML = '<strong>아직 찜한 장소가 없어요</strong><span>지도 말풍선을 눌러 저장해보세요!</span>';
        emptyEl.style.cursor = 'default';
        favoriteList.appendChild(emptyEl);
        return;
    }

    for (var i = 0; i < favoritePlaces.length; i++) {
        var place = favoritePlaces[i];
        var itemEl = document.createElement('li');
        itemEl.innerHTML = '<strong>' + place.place_name + '</strong><span>' + place.address_name + '</span><span class="remove_favorite">한 번 더 누르면 삭제</span>';

        (function(index, placeData) {
            itemEl.onclick = function() {
                var confirmDelete = confirm('이 장소를 찜 목록에서 삭제할까요?');
                if (confirmDelete) {
                    favoritePlaces.splice(index, 1);
                    localStorage.setItem('favoritePlaces', JSON.stringify(favoritePlaces));
                    renderFavorites();
                } else {
                    var position = new kakao.maps.LatLng(placeData.y, placeData.x);
                    map.panTo(position);
                }
            };
        })(i, place);

        favoriteList.appendChild(itemEl);
    }
}

function closeAllOverlays() {
    for (var i = 0; i < overlays.length; i++) overlays[i].setMap(null);
}

function removeMarker() {
    for (var i = 0; i < markers.length; i++) markers[i].setMap(null);
    markers = [];
    closeAllOverlays();
    overlays = [];
}
</script>
</body>
</html>
