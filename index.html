<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>장소 검색 서비스</title>
    <style>
        /* 기본 여백 제거 및 전체 화면 설정 */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        
        .container { display: flex; width: 100%; height: 100vh; }

        /* 왼쪽 검색창 영역 */
        #menu_wrap { width: 300px; padding: 15px; background: #f7f7f7; border-right: 1px solid #ccc; overflow-y: auto; }
        
        /* 오른쪽 지도 영역 */
        #map { flex: 1; height: 100%; }

        h2 { font-size: 1.2rem; margin-bottom: 15px; }
        input { padding: 8px; width: 70%; border: 1px solid #ddd; }
        button { padding: 8px; cursor: pointer; background: #fee500; border: none; font-weight: bold; }
        
        #placesList { list-style: none; padding: 0; margin-top: 20px; }
        #placesList li { padding: 10px; border-bottom: 1px solid #ddd; background: white; margin-bottom: 5px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <div id="menu_wrap">
        <h2>📍 장소 검색</h2>
        <form onsubmit="searchPlaces(); return false;">
            <input type="text" value="학교" id="keyword" placeholder="검색어를 입력하세요">
            <button type="submit">검색</button>
        </form>
        <ul id="placesList"></ul>
    </div>

    <div id="map"></div>
</div>

<script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=812e888a788f00bb238aabf1e311cc38&libraries=services"></script>

<script>
// --- JavaScript 시작 ---

// 1. 지도 생성
var mapContainer = document.getElementById('map'), 
    mapOption = { 
        center: new kakao.maps.LatLng(37.66, 126.83), // 요청하신 학교 위치
        level: 5 // 확대 레벨
    }; 

var map = new kakao.maps.Map(mapContainer, mapOption);

// 2. 장소 검색 서비스 객체 생성
var ps = new kakao.maps.services.Places(); 

// 3. 검색 함수
function searchPlaces() {
    var keyword = document.getElementById('keyword').value;

    if (!keyword.replace(/^\s+|\s+$/g, '')) {
        alert('키워드를 입력해주세요!');
        return false;
    }

    // 장소검색 객체를 통해 키워드로 장소검색을 요청합니다
    ps.keywordSearch(keyword, placesSearchCB); 
}

// 4. 장소검색이 완료됐을 때 호출되는 콜백함수
function placesSearchCB(data, status, pagination) {
    if (status === kakao.maps.services.Status.OK) {
        displayPlaces(data);
    } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
        alert('검색 결과가 존재하지 않습니다.');
    } else if (status === kakao.maps.services.Status.ERROR) {
        alert('검색 결과 중 오류가 발생했습니다.');
    }
}

// 5. 검색 결과 목록과 마커를 표출하는 함수
function displayPlaces(places) {
    var listEl = document.getElementById('placesList'),
        bounds = new kakao.maps.LatLngBounds();
    
    // 이전 검색 결과 제거
    listEl.innerHTML = '';

    for (var i=0; i<places.length; i++) {
        var placePosition = new kakao.maps.LatLng(places[i].y, places[i].x);
        var marker = new kakao.maps.Marker({
            position: placePosition
        });

        marker.setMap(map); // 지도에 마커 표시
        bounds.extend(placePosition); // 지도 범위 조정을 위해 좌표 추가

        // 왼쪽 리스트에 항목 추가
        var itemEl = document.createElement('li');
        itemEl.innerHTML = '<strong>' + places[i].place_name + '</strong><br>' + places[i].address_name;
        listEl.appendChild(itemEl);
    }

    // 검색된 장소 위치를 기준으로 지도 범위 재설정
    map.setBounds(bounds);
}
</script>
</body>
</html>
